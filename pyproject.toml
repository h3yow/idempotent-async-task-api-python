[project]
name = "idempotent-async-task-api-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 跑单测时实时输出日志：请求标识、当前并发度、状态流转、动作发生次数
log_cli = true
log_cli_level = "INFO"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
